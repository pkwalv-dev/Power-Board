<body><div id="app"></div>
<script>// ---------- app ----------
// Course, quarters, and standards come from the server (getConfig).
let CFG=null,STD=[],QS={};
const QN=[1,2,3,4];
function setConfig(c){
  CFG={course:String(c.course||''),current:Math.min(4,Math.max(1,Math.round(+c.current)||1))};QS={};STD=[];
  (Array.isArray(c.quarters)?c.quarters:[]).forEach(x=>{const q=+x.q;QS[q]=(Array.isArray(x.stds)?x.stds:[]).map((s,i)=>({id:String(s.id),code:String(s.code),title:String(s.title),sub:String(s.sub),q,c:`var(--hl${i%6+1})`}));STD=STD.concat(QS[q])});
  QN.forEach(q=>{QS[q]=QS[q]||[]});
}
const PASS=10,BOXES=5,HIST_MAX=40;
const full=q=>QS[q].length*BOXES;
const BADGE={weekQuizzes:5,streakDays:3,jump:3,jumpDays:7};   // badge thresholds
const IDLE_MIN=20;                                              // sign students out after this much inactivity
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,Math.round(+v)||0));
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'x';
const docId=r=>`p${r.cls}_${slug(r.name)}`;
const cleanName=s=>String(s==null?'':s).replace(/[\u0000-\u001f<>]/g,'').replace(/\s+/g,' ').trim().replace(/^[=+\-@\s]+/,'').slice(0,40);
function sanitize(o){
  if(!o||typeof o!=='object')return null;
  const name=cleanName(o.name),cls=String(o.cls||'');
  if(!name||!/^[1-8]$/.test(cls))return null;
  const std={};for(const s of STD){const x=(o.std&&o.std[s.id])||{};std[s.id]={best:clamp(x.best,0,10),att:clamp(x.att,0,9999),mast:clamp(x.mast,0,999),wrong:clamp(x.wrong,0,99999)}}
  const hist=(Array.isArray(o.hist)?o.hist:[]).filter(e=>Array.isArray(e)&&e.length===4).map(e=>[String(e[0]).slice(0,16),+e[1]||0,clamp(e[2],0,STD.length-1),clamp(e[3],0,10)]).slice(-HIST_MAX);
  const done={},doneErr={};QN.forEach(q=>{done[q]=String((o.done&&o.done[q])||'').slice(0,30);doneErr[q]=clamp(o.doneErr&&o.doneErr[q],0,99999)});
  return {name,cls,std,done,doneErr,updated:String(o.updated||'').slice(0,30),hist};
}
const boxCount=(r,q)=>QS[q].reduce((n,s)=>n+Math.min(r.std[s.id].mast,BOXES),0);
const missCount=(r,q)=>QS[q].reduce((n,s)=>n+r.std[s.id].wrong,0);
const bestSum=(r,q)=>QS[q].reduce((n,s)=>n+r.std[s.id].best,0);

// ----- badges -----
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const prevSchoolDay=d=>{d=new Date(d);do{d.setDate(d.getDate()-1)}while(d.getDay()===0||d.getDay()===6);return d};
function badges(r,now,q){
  now=now||Date.now();q=q||CFG.current;const H=r.hist,today=dayKey(now),out=[];
  const todays=H.filter(e=>dayKey(e[1])===today);
  const boxesToday=todays.filter(e=>e[3]===10).length;
  if(r.done[q])out.push({k:'done',i:'👑',t:`Q${q} board complete`,s:'Complete'});
  if(boxesToday)out.push({k:'box',i:'⭐',t:boxesToday>1?`${boxesToday} boxes today`:'Box today',s:`+${boxesToday} today`});
  const wk=new Date(now);wk.setHours(0,0,0,0);wk.setDate(wk.getDate()-((wk.getDay()+6)%7));
  const jump=H.some((e,i)=>{if(e[1]<now-BADGE.jumpDays*864e5)return false;for(let j=i-1;j>=0;j--)if(H[j][2]===e[2])return e[3]-H[j][3]>=BADGE.jump;return false});
  if(jump)out.push({k:'jump',i:'🚀',t:'Big jump',s:'Big jump'});
  const days=new Set(H.map(e=>dayKey(e[1])));let d=new Date(now),streak=0;
  if(!days.has(today))d=prevSchoolDay(d);
  if(d.getDay()===0||d.getDay()===6)d=prevSchoolDay(d);
  while(days.has(dayKey(d))){streak++;d=prevSchoolDay(d)}
  if(streak>=BADGE.streakDays)out.push({k:'streak',i:'🔥',t:`${streak}-day streak`,s:`${streak} days`});
  const week=H.filter(e=>e[1]>=wk.getTime()).length;
  if(week>=BADGE.weekQuizzes)out.push({k:'week',i:'💪',t:`${week} quizzes this week`,s:`${week} this week`});
  return {active:todays.length>0,list:out};
}
const BADGE_KEY=[['👑','Board complete'],['⭐','Box today'],['🚀','Big jump'],['🔥','Streak'],['💪','Busy week']];

// ----- ranking (not shown to students) -----
function rankClass(rows,q){
  const done=rows.filter(r=>r.done[q]),rest=rows.filter(r=>!r.done[q]);
  const byTime=done.slice().sort((a,b)=>a.done[q].localeCompare(b.done[q]));
  const tRank=new Map(byTime.map((r,i)=>[r,i+1]));
  const errs=done.map(r=>r.doneErr[q]).sort((a,b)=>a-b);
  const eRank=r=>errs.indexOf(r.doneErr[q])+1;
  done.sort((a,b)=>(tRank.get(a)+eRank(a))-(tRank.get(b)+eRank(b))||a.done[q].localeCompare(b.done[q]));
  rest.sort((a,b)=>boxCount(b,q)-boxCount(a,q)||bestSum(b,q)-bestSum(a,q)||missCount(a,q)-missCount(b,q)||a.updated.localeCompare(b.updated)||a.name.localeCompare(b.name));
  return done.concat(rest);
}

const h=(t,a={},...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a)){if(n==='class')e.className=v;else if(n==='html')e.innerHTML=v;else if(n.startsWith('on'))e.addEventListener(n.slice(2),v);else if(v===true)e.setAttribute(n,'');else if(v!==false&&v!=null)e.setAttribute(n,v)}for(const c of k.flat())if(c!=null&&c!==false)e.append(c);return e};
const app=document.getElementById('app');
const GS=(window.google&&google.script&&google.script.run)||null;
const call=(fn,...a)=>new Promise((ok,no)=>{if(!GS)return no(new Error('NET: This page only works from the web app link.'));GS.withSuccessHandler(ok).withFailureHandler(no)[fn](...a)});
// Server errors look like "CODE: message".
const errOf=e=>{const m=String((e&&e.message)||e||'').replace(/^Error:\s*/,''),k=m.match(/^([A-Z]+):\s*(.*)$/);return k?{code:k[1],msg:k[2]}:{code:'NET',msg:'Could not reach the server. Check the Wi-Fi and try again.'}};
// Retry busy/network failures a couple of times (every server step is safe to repeat).
async function callR(fn,...a){for(let k=0;;k++){try{return await call(fn,...a)}catch(e){if(errOf(e).code!=='NET'||k>=2||!GS)throw e;await new Promise(r=>setTimeout(r,600+Math.random()*900*(k+1)))}}}
const S={view:'boot',tok:null,rec:null,quiz:null,msg:'',busy:false,q:1,L:{cls:null,names:null,pin:''},T:{tok:null,rows:null,pf:'',q:1,err:'',busy:false,tried:false},B:null,lastAct:Date.now()};
function go(v){if(S.view==='dash'&&v!=='dash')stopDash();S.view=v;render();window.scrollTo(0,0)}
function toLogin(msg){S.tok=null;S.rec=null;S.quiz=null;S.msg=msg||'';S.L.pin='';go('login')}
function handle(e){const x=errOf(e);if(x.code==='SESSION'){toLogin(x.msg);return true}return false}

// Shared Chromebooks: sign out after inactivity.
['click','keydown','touchstart'].forEach(t=>document.addEventListener(t,()=>{S.lastAct=Date.now()},{passive:true,capture:true}));
setInterval(()=>{if(S.tok&&Date.now()-S.lastAct>IDLE_MIN*60000){const t=S.tok;call('signOut',t).catch(()=>{});toLogin(`Signed out after ${IDLE_MIN} minutes without activity.`)}},30000);

// ----- views -----
function render(){
  const v={boot:vBoot,login:vLogin,board:vBoard,quiz:vQuiz,result:vResult,teacher:vTeacher,dash:vDash}[S.view];
  app.replaceChildren(v());
  const f=app.querySelector('[autofocus]');if(f)f.focus({preventScroll:true});

  }
  const before=new Map();B.cards.forEach((el,id)=>before.set(id,el.getBoundingClientRect()));
  const els=[],seen=new Set();
  ranked.forEach((r,i)=>{
    const id=docId(r),rank=i+1,old=B.rank.get(id);seen.add(id);
    if(!first&&old&&rank<old)B.moved.set(id,{d:old-rank,until:now+90000});
    const m=B.moved.get(id);
    els.push(dashCard(id,r,rank,badges(r,now,q),m&&m.until>now?m.d:0));
    B.rank.set(id,rank);B.prev.set(id,{m:Object.fromEntries(QS[q].map(s=>[s.id,r.std[s.id].mast])),done:!!r.done[q]});
  });
  [...B.cards.keys()].forEach(id=>{if(!seen.has(id))B.cards.delete(id)});
  g.replaceChildren(...els);
  if(!els.length)g.replaceChildren(h('p',{class:'dempty'},`No quizzes yet in Period ${B.cls}. Cards appear here as students finish.`));
  fitDash();
  if(!first&&!reduced())els.forEach(el=>{const b=before.get(el.dataset.id);if(!b)return;const a=el.getBoundingClientRect(),dx=b.left-a.left,dy=b.top-a.top;
    if(dx||dy){el.style.transition='none';el.style.transform=`translate(${dx}px,${dy}px)`;el.getBoundingClientRect();requestAnimationFrame(()=>{el.style.transition='transform .9s cubic-bezier(.2,.8,.2,1)';el.style.transform=''})}});
  const tot=ranked.reduce((n,r)=>n+boxCount(r,q),0),cap=ranked.length*full(q),pct=cap?Math.round(tot/cap*100):0;
  const fill=document.getElementById('cpfill');if(fill)fill.style.width=pct+'%';
  const ct=document.getElementById('cptext');if(ct)ct.textContent=`Class progress ${pct}%`;
  const today=dayKey(now),tq=ranked.reduce((n,r)=>n+r.hist.filter(e=>dayKey(e[1])===today).length,0),tb=ranked.reduce((n,r)=>n+r.hist.filter(e=>dayKey(e[1])===today&&e[3]===10).length,0);
  const td=document.getElementById('today');if(td)td.textContent=`Today: ${tq} ${tq===1?'quiz':'quizzes'}, ${tb} ${tb===1?'box':'boxes'}`;
}
async function pollDash(){
  const B=S.B;if(!B||S.view!=='dash')return;clearTimeout(B.timer);
  if(document.hidden){B.timer=setTimeout(pollDash,4000);return}
  const st=document.getElementById('dst');
  try{
    const rows=((await callR('getBoard',S.T.tok,B.cls))||[]).map(sanitize).filter(Boolean);
    if(S.B!==B||S.view!=='dash')return;
    updateDash(rows,!B.loaded);B.loaded=true;if(st)st.textContent='';
  }catch(e){
    if(S.B!==B)return;
    const x=errOf(e);
    if(x.code==='SESSION'){S.T.tok=null;if(st)st.textContent='Teacher sign-in expired. Exit and sign in again.';return}
    if(st)st.textContent='Reconnecting…';
  }
  B.timer=setTimeout(pollDash,8000);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.view==='dash'&&S.B)pollDash()});
render();boot();
