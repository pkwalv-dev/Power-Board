<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<base target="_top">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>:root{box-sizing:border-box;--paper:#F7FAFF;--grid:#DCE6F3;--ink:#14213D;--muted:#4F6086;--line:#AEBFD9;--card:#FFFFFF;--hl1:#FFE14D;--hl2:#FF9EC4;--hl3:#5EDCEB;--onhl:#14213D;--good:#136B45;--goodbg:#DDF5E8;--bad:#A8241C;--badbg:#FCE4E2;--accent:#2545C9}
@media (prefers-color-scheme:dark){:root{--paper:#0E1731;--grid:#182645;--ink:#EAF0FF;--muted:#9FB2D6;--line:#33456F;--card:#16223F;--good:#7FE3B0;--goodbg:#12382A;--bad:#FF9C94;--badbg:#411D22;--accent:#8FA8FF}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;color:var(--ink);font:400 17px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,.btn,.big,.chip,th{font-family:Archivo,"Arial Narrow",system-ui,sans-serif}
sup{line-height:0}
.wrap{max-width:680px;margin:0 auto;padding:18px 16px 56px}.wrap.wide{max-width:960px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:10px}
h1{font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.01em;margin:0}
.who{display:flex;gap:12px;align-items:baseline;color:var(--muted);font-size:15px}
h2{font-size:20px;line-height:1.2;font-weight:700;margin:0}.h2{margin:22px 0 10px}
.lede{margin:6px 0 18px;max-width:60ch}
.small{font-size:15px;color:var(--muted);margin:10px 0}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:16px;margin:0 0 16px}
.std{box-shadow:5px 5px 0 var(--c)}
.stdhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.chip{display:inline-block;padding:2px 10px;border-radius:6px;background:var(--c);color:var(--onhl);font-weight:700;font-size:14px;border:2px solid var(--ink)}
.sub{margin:4px 0 12px;color:var(--muted)}
.boxes{display:flex;gap:8px;margin:0 0 12px}
.box{flex:1;max-width:56px;aspect-ratio:1;border:2px solid var(--ink);border-radius:8px;display:grid;place-items:center;font-weight:700;color:var(--onhl)}
.box.on{background:var(--c)}
.bestrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:0 0 14px;color:var(--muted);font-size:15px}
.bar{flex:1 1 120px;height:12px;border:2px solid var(--ink);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%}
.done{font-weight:700;margin:0 0 12px}
.btn{font-weight:700;font-size:17px;min-height:48px;padding:10px 20px;border-radius:10px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.6;cursor:default}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer;min-height:32px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.form label{display:block;font-weight:700;margin:12px 0 4px}
.form label:first-child{margin-top:0}
input,select{width:100%;font:inherit;padding:10px 12px;min-height:48px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink)}
.form .btn{margin-top:16px}.err{color:var(--bad);margin:8px 0 0;min-height:1.4em}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:8px;color:var(--muted)}.qhead .link{margin-left:auto}
.prog{display:flex;gap:4px;margin:0 0 14px}.prog i{flex:1;height:10px;border:2px solid var(--ink);border-radius:4px}
.prog i.a{background:var(--c)}.prog i.cur{border-style:dashed}
.q{font-size:20px;line-height:1.45;margin:0 0 14px}
.t{border-collapse:collapse;margin:12px 0 2px}.t th,.t td{border:2px solid var(--ink);padding:5px 14px;text-align:center;font-weight:700}.t th{background:var(--c,var(--hl1));color:var(--onhl)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:0 0 10px;padding:12px 14px;min-height:54px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt b{flex:none;width:30px;height:30px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;font-family:Archivo,system-ui,sans-serif}
.opt .ot{flex:1}.opt:hover{border-color:var(--ink)}
.opt.sel{border-color:var(--ink);background:var(--paper)}.opt.sel b{background:var(--c);color:var(--onhl)}
.nav{display:flex;gap:10px;flex-wrap:wrap}
.score{text-align:center}.big{font-size:56px;font-weight:800;line-height:1}
.msg{margin:10px auto 14px;max-width:44ch}.score .boxes{justify-content:center}
.miss .ans{margin:4px 0}.miss .good{color:var(--good);font-weight:700}
.miss .exp{margin:8px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}.row select{width:auto}
.scroll{overflow-x:auto;margin:0 0 16px}
.dash{border-collapse:collapse;width:100%;background:var(--card);border:2px solid var(--ink)}
.dash th,.dash td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.dash th{background:var(--ink);color:var(--paper)}.dash tfoot td{font-weight:700;color:var(--muted)}
.mini{display:flex;flex-direction:column;gap:3px}.mb{display:flex;gap:2px}.mb i{width:12px;height:12px;border:1.5px solid var(--ink);border-radius:3px}
@media (max-width:420px){h1{font-size:24px}.q{font-size:18px}.t th,.t td{padding:5px 9px}}
</style>
</head>
<body><div id="app"></div>
<script>
// Everything that matters (answers, grading, scores, teacher password) lives on the
// server in Code.gs / TeacherAuth.gs. This page only displays what the server sends.
const STD=[
 {id:'BF1',code:'NC.M1.F-BF.1',title:'Write a function from a situation',sub:'Rules from words, tables, and graphs',c:'var(--hl1)'},
 {id:'BF2',code:'NC.M1.F-BF.2',title:'Arithmetic and geometric sequences',sub:'Recursive and explicit rules',c:'var(--hl2)'},
 {id:'LE1',code:'NC.M1.F-LE.1',title:'Linear or exponential?',sub:'Tell the two apart',c:'var(--hl3)'}];
const PASS=9,BOXES=5;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const run=(fn,...args)=>new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(e&&e.message?e:new Error(String(e))))[fn](...args));
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a)){if(n==='class')e.className=v;else if(n==='html')e.innerHTML=v;else if(n.startsWith('on'))e.addEventListener(n.slice(2),v);else if(v===true)e.setAttribute(n,'');else if(v!==false&&v!=null)e.setAttribute(n,v)}for(const c of k.flat())if(c!=null&&c!==false)e.append(c);return e};
const app=document.getElementById('app');
const S={view:'login',rec:null,quiz:null,result:null,token:null,rows:[],busy:false,err:''};

function go(v){S.view=v;S.err='';render();window.scrollTo(0,0)}
function render(){app.replaceChildren(({login:vLogin,board:vBoard,quiz:vQuiz,result:vResult,tlogin:vTLogin,teacher:vTeacher})[S.view]())}
function fail(e){S.busy=false;S.err=(e&&e.message)||'Something went wrong. Try again.';render()}
const errP=()=>h('p',{class:'err',role:'alert'},S.err);

function head(){
  return h('header',{class:'top'},h('h1',{},'Power Standards Board'),
    S.rec&&h('div',{class:'who'},h('span',{},`${S.rec.name} · Period ${S.rec.cls}`),
      h('button',{class:'link',onclick:()=>{S.rec=null;go('login')}},'Switch student')));
}
function vLogin(){
  const p=store.get('mb_profile')||{};
  const name=h('input',{id:'nm',type:'text',maxlength:'40',autocomplete:'off',placeholder:'First name and last initial',value:p.name||''});
  const cls=h('select',{id:'cl'},[1,2,3,4,5,6,7,8].map(n=>h('option',{value:n,selected:String(p.cls)===String(n)},`Period ${n}`)));
  const start=h('button',{class:'btn',disabled:S.busy,onclick:async()=>{
    const n=name.value.replace(/\s+/g,' ').trim();
    if(n.length<2){S.err='Enter your first name and last initial.';render();return}
    store.set('mb_profile',{name:n,cls:cls.value});
    S.busy=true;render();
    try{S.rec=await run('getRecord',n,cls.value);S.busy=false;go('board')}catch(e){fail(e)}}},S.busy?'Loading…':'Start');
  return h('main',{class:'wrap'},head(),
    h('p',{class:'lede'},'Take 10-question mastery quizzes on this quarter’s three power standards. Score 9 or 10 to color in a box on your board.'),
    h('div',{class:'card form'},h('label',{for:'nm'},'Your name'),name,h('label',{for:'cl'},'Class period'),cls,errP(),start),
    h('p',{class:'small'},h('button',{class:'link',onclick:()=>go('tlogin')},'Teacher view')));
}
function boxes(st,c){
  return h('div',{class:'boxes','aria-label':`${Math.min(st.mast,BOXES)} of ${BOXES} boxes colored`},
    [...Array(BOXES)].map((_,i)=>h('span',{class:'box'+(i<st.mast?' on':''),style:`--c:${c}`},i<st.mast?'✓':'')));
}
function vBoard(){
  const cards=STD.map(s=>{const st=S.rec.std[s.id];
    return h('section',{class:'card std',style:`--c:${s.c}`},
      h('div',{class:'stdhead'},h('span',{class:'chip'},s.code),h('h2',{},s.title)),
      h('p',{class:'sub'},s.sub),boxes(st,s.c),
      h('div',{class:'bestrow'},h('div',{class:'bar',role:'img','aria-label':`Best score ${st.best} out of 10`},h('i',{style:`width:${st.best*10}%;background:${s.c}`})),
        h('span',{},st.att?`Best ${st.best}/10 · ${st.att} ${st.att===1?'quiz':'quizzes'}`:'No quizzes yet')),
      st.mast>=BOXES&&h('p',{class:'done'},'Board complete for this standard.'),
      h('button',{class:'btn',disabled:S.busy,onclick:()=>startQuiz(s)},st.att?'Take another 10-question quiz':'Start 10-question quiz'));});
  return h('main',{class:'wrap'},head(),
    h('p',{class:'lede'},`Score ${PASS} or 10 to color in a box. Fill all ${BOXES} boxes on each row.`),
    errP(),cards,h('p',{class:'small'},'Your scores are saved for your teacher.'));
}
async function startQuiz(s){
  S.busy=true;render();
  try{const q=await run('startQuiz',s.id);S.quiz={s,id:q.quizId,qs:q.qs,i:0,picks:[]};S.busy=false;go('quiz')}catch(e){fail(e)}
}
function vQuiz(){
  const Q=S.quiz,q=Q.qs[Q.i],picked=Q.picks[Q.i],last=Q.i===9;
  const seg=[...Array(10)].map((_,i)=>h('i',{class:(Q.picks[i]!==undefined?'a':'')+(i===Q.i?' cur':'')}));
  const opts=q.opts.map((o,j)=>h('button',{class:'opt'+(picked===j?' sel':''),'aria-pressed':String(picked===j),onclick:()=>{Q.picks[Q.i]=j;render()}},
    h('b',{},'ABCD'[j]),h('span',{class:'ot',html:o})));
  const allDone=Q.picks.filter(x=>x!==undefined).length===10;
  return h('main',{class:'wrap',style:`--c:${Q.s.c}`},
    h('div',{class:'qhead'},h('span',{class:'chip',style:`background:${Q.s.c}`},Q.s.code),h('span',{},`Question ${Q.i+1} of 10`),
      h('button',{class:'link',onclick:()=>{if(confirm('Leave this quiz? Your answers will not count.'))go('board')}},'Exit')),
    h('div',{class:'prog'},seg),
    h('div',{class:'card'},h('div',{class:'q',html:q.stem}),h('div',{class:'opts'},opts)),
    errP(),
    h('div',{class:'nav'},
      Q.i>0&&h('button',{class:'btn alt',onclick:()=>{Q.i--;render()}},'Back'),
      last?h('button',{class:'btn',disabled:!allDone||S.busy,onclick:submit},S.busy?'Grading…':allDone?'Submit quiz':'Answer every question to submit')
          :h('button',{class:'btn',disabled:picked===undefined,onclick:()=>{Q.i++;render();window.scrollTo(0,0)}},'Next question')));
}
async function submit(){
  const Q=S.quiz;S.busy=true;render();
  try{const r=await run('submitQuiz',Q.id,S.rec.name,S.rec.cls,Q.picks);S.rec=r.rec;S.result=r;S.busy=false;go('result')}catch(e){fail(e)}
}
function vResult(){
  const Q=S.quiz,R=S.result,st=S.rec.std[Q.s.id];
  const missed=R.review.map((q,i)=>({q,i})).filter(x=>x.q.pick!==x.q.ans);
  return h('main',{class:'wrap',style:`--c:${Q.s.c}`},head(),
    h('div',{class:'card score'},h('div',{class:'big'},`${R.score} / 10`),
      R.pass?h('p',{class:'msg'},`Mastered. Color in box ${Math.min(st.mast,BOXES)} on your ${Q.s.code} row.`)
            :h('p',{class:'msg'},`Not yet. ${PASS} out of 10 masters it. You scored ${R.score}. Review the misses below, then try again.${R.score<7?' Stop by for tips before your next try.':''}`),
      boxes(st,Q.s.c),h('p',{class:'small'},'Saved for your teacher.')),
    missed.length?h('section',{},h('h2',{class:'h2'},'Review your misses'),
      missed.map(({q,i})=>h('div',{class:'card miss'},h('div',{class:'q',html:`${i+1}. ${q.stem}`}),
        h('p',{class:'ans'},h('span',{},'Your answer: '),h('span',{html:q.opts[q.pick]||'—'})),
        h('p',{class:'ans good'},h('span',{},'Correct: '),h('span',{html:q.opts[q.ans]})),
        h('p',{class:'exp',html:q.exp})))):h('p',{class:'lede'},'No misses. Clean sweep.'),
    errP(),
    h('div',{class:'row'},h('button',{class:'btn',disabled:S.busy,onclick:()=>startQuiz(Q.s)},'Try another 10'),h('button',{class:'btn alt',onclick:()=>go('board')},'Back to board')));
}

// ----- teacher -----
function vTLogin(){
  const pw=h('input',{id:'tpw',type:'password',autocomplete:'current-password'});
  const back=()=>go(S.rec?'board':'login');
  const unlock=async()=>{
    S.busy=true;render();
    try{
      const res=await run('checkTeacherPassword',pw.value);
      if(!res.ok){S.busy=false;S.err=res.msg;render();return}
      S.token=res.token;S.rows=await run('getClassData',S.token);S.busy=false;go('teacher');
    }catch(e){fail(e)}
  };
  pw.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
  return h('main',{class:'wrap'},h('header',{class:'top'},h('h1',{},'Teacher view'),h('button',{class:'link',onclick:back},'Back')),
    h('div',{class:'card form'},h('label',{for:'tpw'},'Teacher password'),pw,errP(),
      h('button',{class:'btn',disabled:S.busy,onclick:unlock},S.busy?'Checking…':'Unlock')));
}
function vTeacher(){
  const filter=h('select',{id:'pf',onchange:fillTable},h('option',{value:''},'All periods'),[1,2,3,4,5,6,7,8].map(n=>h('option',{value:n},`Period ${n}`)));
  const refresh=h('button',{class:'btn alt',onclick:async()=>{try{S.rows=await run('getClassData',S.token);fillTable()}catch(e){S.token=null;go('tlogin')}}},'Refresh');
  const out=h('button',{class:'link',onclick:()=>{run('logoutTeacher',S.token).catch(()=>{});S.token=null;S.rows=[];go(S.rec?'board':'login')}},'Log out');
  const m=h('main',{class:'wrap wide'},h('header',{class:'top'},h('h1',{},'Class progress'),out),
    h('div',{class:'row'},h('label',{for:'pf'},'Show'),filter,refresh),h('div',{class:'scroll',id:'tw'}));
  setTimeout(fillTable);
  return m;
}
function fillTable(){
  const tw=document.getElementById('tw');if(!tw)return;
  const pf=document.getElementById('pf').value;
  const rows=S.rows.filter(r=>!pf||r.cls===pf).sort((a,b)=>a.cls.localeCompare(b.cls)||a.name.localeCompare(b.name));
  if(!rows.length){tw.replaceChildren(h('p',{class:'lede'},'No results yet. Scores appear here as students finish quizzes.'));return}
  const cell=(st,c)=>h('td',{},h('div',{class:'mini'},h('b',{},st.att?`${st.best}/10`:'–'),h('span',{class:'mb'},[...Array(BOXES)].map((_,i)=>h('i',{style:i<st.mast?`background:${c}`:''})))));
  const mastAll=STD.map(s=>rows.filter(r=>r.std[s.id].mast>0).length);
  tw.replaceChildren(h('table',{class:'dash'},
    h('thead',{},h('tr',{},h('th',{},'Student'),h('th',{},'Pd'),STD.map(s=>h('th',{},s.code.replace('NC.M1.F-',''))),h('th',{},'Last quiz'))),
    h('tbody',{},rows.map(r=>h('tr',{},h('td',{},r.name),h('td',{},r.cls),STD.map(s=>cell(r.std[s.id],s.c)),h('td',{},r.updated?new Date(r.updated).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'–')))),
    h('tfoot',{},h('tr',{},h('td',{colspan:'2'},`${rows.length} students`),mastAll.map(n=>h('td',{},`${n} mastered ≥1`)),h('td',{})))));
}
render();
</script>
</body></html>
